      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: |
          mkdir /tmp/wrapgen && cd /tmp/wrapgen
          echo 'rootProject.name = "wrapgen"' > settings.gradle
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          cp -r gradlew gradlew.bat gradle "$GITHUB_WORKSPACE/"
          chmod +x "$GITHUB_WORKSPACE/gradlew"

      - name: Commit project files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Ayham TV project (phase 1)" || echo "Nothing to commit"
          git push

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ayham-TV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
